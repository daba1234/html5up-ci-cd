name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: html5up-app
  IMAGE_TAG: latest
  DOCKER_REGISTRY: docker.io

jobs:
  # ========== JOB 1: BUILD & PUSH (CI) ==========
  build:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # Étape 1: Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2: Se connecter à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Étape 3: Construire l'image Docker
      - name: Build Docker image
        run: |
          docker build -f assets/Dockerfile -t ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker build -f assets/Dockerfile -t ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Étape 4: Pousser l'image vers Docker Hub
      - name: Push to Docker Hub
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Étape 5: Afficher les informations
      - name: Image pushed successfully
        run: echo "Image pushed:${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

  # ========== JOB 2: DEPLOY (CD) ==========
  deploy:
    name: Deploy to Self-Hosted Runner
    runs-on: runner-isi  # Runner personnalisé
    needs: build  # Dépend du job build

    steps:
      # Étape 1: Se connecter à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Étape 2: Récupérer la dernière image
      - name: Pull latest image from Docker Hub
        run: |
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Étape 3: Arrêter le conteneur existant
      - name: Stop existing container
        run: docker stop html5up-container
        continue-on-error: true

      # Étape 4: Supprimer le conteneur existant
      - name: Remove old container
        run: docker rm html5up-container
        continue-on-error: true

      # Étape 5: Lancer le nouveau conteneur
      - name: Run new container
        run: |
          docker run -d \
            --name html5up-container \
            -p 80:80 \
            --restart unless-stopped \
            ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Étape 6: Vérifier le statut
      - name: Verify container is running
        run: |
          sleep 2
          docker ps | grep html5up-container
          echo "Container is running successfully!"
