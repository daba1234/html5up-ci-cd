name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: html5up-app
  IMAGE_TAG: latest
  DOCKER_REGISTRY: docker.io

jobs:
  # JOB 1 : BUILD & PUSH
  build:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Etape 1: Recuperer le code source
        uses: actions/checkout@v4

      - name: Etape 2: se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Etape 3: Construire l'image Docker
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Etape 4: Pousser l'image vers Docker Hub
        run: docker push ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # JOB 2 : DEPLOY
  deploy:
    name: Deploy to Self Hosted Runner
    needs: build
    runs-on: runner-isi
    steps:
      - name: Etape 1: se connecter a Docker Hub
        run: echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Etape 2: Pull la derniere image depuis Docker Hub
        run: docker pull ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Etape 3: Stopper le conteneur existant
        run: docker stop html5up-container 2>$null
        continue-on-error: true

      - name: Etape 4: Supprimer l'ancien conteneur
        run: docker rm html5up-container 2>$null
        continue-on-error: true

      - name: Etape 5: Lancer le nouveau conteneur
        run: |
          docker run -d `
          --name html5up-container `
          --restart unless-stopped `
          -p 80:80 `
          "${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Etape 6: Verifier le status
        run: |
          docker ps | Select-String "html5up-container"
          Write-Host "Container is running successfully"