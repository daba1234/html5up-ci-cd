name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: html5up-app
  IMAGE_TAG: latest
  DOCKER_REGISTRY: docker.io

jobs:
  # ========== JOB 1: BUILD & PUSH (CI) ==========
  build:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    
    steps:
      # Étape 1: Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2: Se connecter à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Étape 3: Construire l'image Docker
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Étape 4: Pousser l'image vers Docker Hub
      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Étape 5: Afficher les informations
      - name: Image pushed successfully
        run: echo "✓ Image pushed: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

  # ========== JOB 2: DEPLOY (CD) ==========
  deploy:
    name: Deploy to Self-Hosted Runner
    runs-on: runner-isi  # Runner personnalisé
    needs: build  # Dépend du job build
    
    steps:
      # Étape 1: Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2: Se connecter à Docker Hub
      - name: Login to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      # Étape 3: Récupérer la dernière image
      - name: Pull latest image from Docker Hub
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Étape 4: Arrêter le conteneur existant
      - name: Stop existing container
        run: |
          docker stop html5up-container 2>/dev/null || echo "No container to stop"
        continue-on-error: true

      # Étape 5: Supprimer le conteneur existant
      - name: Remove old container
        run: |
          docker rm html5up-container 2>/dev/null || echo "No container to remove"
        continue-on-error: true

      # Étape 6: Lancer le nouveau conteneur
      - name: Run new container
        run: |
          docker run -d \
            --name html5up-container \
            -p 80:80 \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Étape 7: Vérifier le statut
      - name: Verify container is running
        run: |
          sleep 2
          docker ps | grep html5up-container || exit 1
          echo "✓ Container is running successfully!"